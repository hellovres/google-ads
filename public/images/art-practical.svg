<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Phone with payment QR code, metro card and passport">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbf7ee"/>
    <stop offset="0.55" stop-color="#f0e6d2"/>
    <stop offset="1" stop-color="#e2d1b0"/>
  </linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#276354"/>
    <stop offset="0.55" stop-color="#315b78"/>
    <stop offset="1" stop-color="#15231d"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d2a64c"/>
    <stop offset="1" stop-color="#cf4d2f"/>
  </linearGradient>
  <pattern id="windows" width="18" height="22" patternUnits="userSpaceOnUse">
    <rect width="18" height="22" fill="#15231d"/>
    <rect x="4" y="5" width="5" height="6" fill="#d2a64c" opacity="0.9"/>
    <rect x="12" y="13" width="3" height="4" fill="#fbf7ee" opacity="0.7"/>
  </pattern>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="111" cy="94" r="54" fill="#d2a64c" opacity="0.35"/>
  <g transform="translate(306 56)">
    <rect width="215" height="430" rx="34" fill="#15231d"/>
    <rect x="9" y="9" width="197" height="412" rx="27" fill="#fbf7ee"/>
    <rect x="83" y="19" width="49" height="7" rx="3.5" fill="#15231d"/>
    <text x="30" y="65" fill="#67736c" font-family="DM Sans,sans-serif" font-size="9" letter-spacing="2">PAY HERE</text>
    <rect x="30" y="82" width="155" height="155" rx="10" fill="#15231d"/>
    <g fill="#fbf7ee">
      <rect x="43" y="95" width="43" height="43"/><rect x="129" y="95" width="43" height="43"/><rect x="43" y="181" width="43" height="43"/>
    </g>
    <g fill="#15231d">
      <rect x="52" y="104" width="25" height="25"/><rect x="138" y="104" width="25" height="25"/><rect x="52" y="190" width="25" height="25"/>
      <rect x="96" y="96" width="7" height="7"/><rect x="108" y="108" width="7" height="7"/><rect x="96" y="132" width="7" height="7"/><rect x="118" y="122" width="7" height="7"/>
      <rect x="96" y="154" width="7" height="7"/><rect x="118" y="168" width="7" height="7"/><rect x="104" y="187" width="7" height="7"/><rect x="96" y="207" width="7" height="7"/>
      <rect x="118" y="202" width="7" height="7"/><rect x="132" y="180" width="7" height="7"/><rect x="142" y="195" width="7" height="7"/><rect x="153" y="210" width="7" height="7"/>
    </g>
    <rect x="30" y="263" width="155" height="1" fill="#d7cdbb"/>
    <text x="30" y="293" fill="#15231d" font-family="Georgia,serif" font-size="17">Scan to pay</text>
    <text x="30" y="311" fill="#67736c" font-family="DM Sans,sans-serif" font-size="9">Alipay · WeChat Pay</text>
    <rect x="30" y="333" width="155" height="44" rx="22" fill="#cf4d2f"/>
    <text x="107" y="360" text-anchor="middle" fill="#fbf7ee" font-family="DM Sans,sans-serif" font-size="10" letter-spacing="1.5">CONFIRM</text>
    <rect x="30" y="391" width="155" height="1" fill="#d7cdbb"/>
  </g>
  <g transform="translate(91 349) rotate(-8)">
    <rect width="184" height="113" rx="10" fill="#276354"/>
    <rect x="13" y="13" width="158" height="87" rx="5" fill="none" stroke="#fbf7ee" stroke-width="1" opacity="0.55"/>
    <circle cx="35" cy="39" r="11" fill="#d2a64c"/>
    <text x="55" y="43" fill="#fbf7ee" font-family="DM Sans,sans-serif" font-size="9" letter-spacing="1.5">METRO</text>
    <text x="22" y="78" fill="#fbf7ee" font-family="Georgia,serif" font-size="18">Chongqing</text>
    <path d="M136 26h20v20h-20Z" fill="#fbf7ee" opacity="0.8"/>
  </g>
  <g transform="translate(575 273) rotate(7)">
    <rect width="151" height="197" rx="8" fill="#b23a2b"/>
    <rect x="15" y="17" width="121" height="163" rx="3" fill="none" stroke="#f1e4c5" stroke-width="1" opacity="0.65"/>
    <circle cx="75" cy="74" r="29" fill="none" stroke="#f1e4c5" stroke-width="1.5"/>
    <path d="M53 74h44M75 52v44" stroke="#f1e4c5" stroke-width="1"/>
    <text x="75" y="119" text-anchor="middle" fill="#f1e4c5" font-family="Georgia,serif" font-size="12" letter-spacing="2">CHINA</text>
    <text x="75" y="141" text-anchor="middle" fill="#f1e4c5" font-family="DM Sans,sans-serif" font-size="7" letter-spacing="1.8">ENTRY</text>
    <path d="M30 163h91" stroke="#f1e4c5" stroke-width="1" opacity="0.4"/>
  </g>
  <text x="48" y="504" fill="#15231d" font-family="Georgia,serif" font-size="21" font-style="italic">set it up before you fly</text>
  <g filter="url(#grain)" opacity="0.35"><rect width="800" height="560" fill="#fbf7ee"/></g>
