<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Route map connecting three days in Chongqing">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbf7ee"/>
    <stop offset="0.55" stop-color="#f0e6d2"/>
    <stop offset="1" stop-color="#e2d1b0"/>
  </linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#276354"/>
    <stop offset="0.55" stop-color="#315b78"/>
    <stop offset="1" stop-color="#15231d"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d2a64c"/>
    <stop offset="1" stop-color="#cf4d2f"/>
  </linearGradient>
  <pattern id="windows" width="18" height="22" patternUnits="userSpaceOnUse">
    <rect width="18" height="22" fill="#15231d"/>
    <rect x="4" y="5" width="5" height="6" fill="#d2a64c" opacity="0.9"/>
    <rect x="12" y="13" width="3" height="4" fill="#fbf7ee" opacity="0.7"/>
  </pattern>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <g fill="none" stroke="#276354" opacity="0.2" stroke-width="1.3">
    <path d="M-10 111c87-34 146-6 206 30s110 33 164-11 99-42 164-7 108 50 190 12"/>
    <path d="M-10 149c83-25 145-2 203 33s103 34 161-7 108-34 163 2 106 41 190 18"/>
    <path d="M-10 188c78-17 140 3 197 35s105 30 163-9 104-32 163 4 104 38 184 23"/>
    <path d="M-10 228c90-23 145 2 201 30s102 31 160-7 102-35 160-2 111 39 189 18"/>
    <path d="M-10 268c78-11 136 6 193 32s110 27 164-13 105-26 162 8 97 31 177 20"/>
  </g>
  <path d="M144 397c5-80 56-97 119-67 56 27 97-2 99-58 2-45 39-70 82-60 51 11 69-30 104-71" fill="none" stroke="#cf4d2f" stroke-width="6" stroke-linecap="round"/>
  <g>
    <circle cx="144" cy="397" r="31" fill="#15231d"/><text x="144" y="404" text-anchor="middle" fill="#fbf7ee" font-family="Georgia,serif" font-size="20">1</text>
    <circle cx="363" cy="272" r="31" fill="#15231d"/><text x="363" y="279" text-anchor="middle" fill="#fbf7ee" font-family="Georgia,serif" font-size="20">2</text>
    <circle cx="548" cy="141" r="31" fill="#15231d"/><text x="548" y="148" text-anchor="middle" fill="#fbf7ee" font-family="Georgia,serif" font-size="20">3</text>
  </g>
  <g fill="#fbf7ee" stroke="#15231d" stroke-width="1.5">
    <rect x="186" y="346" width="128" height="52" rx="4"/><rect x="405" y="231" width="128" height="52" rx="4"/><rect x="588" y="96" width="128" height="52" rx="4"/>
  </g>
  <g fill="#15231d" font-family="DM Sans,sans-serif" font-size="10" letter-spacing="1.5">
    <text x="200" y="367">Jiefangbei</text><text x="200" y="383" fill="#67736c" font-size="8">Arrive + river</text>
    <text x="419" y="252">Liziba</text><text x="419" y="268" fill="#67736c" font-size="8">Monorail + views</text>
    <text x="602" y="117">Hongyadong</text><text x="602" y="133" fill="#67736c" font-size="8">Night skyline</text>
  </g>
  <g transform="translate(96 86)">
    <circle r="38" fill="none" stroke="#15231d" stroke-width="1"/>
    <path d="M0-28 9 7 0 0-9 7Z" fill="#cf4d2f"/>
    <text x="0" y="57" text-anchor="middle" fill="#15231d" font-family="DM Sans,sans-serif" font-size="9" letter-spacing="2">PLAN</text>
  </g>
  <text x="607" y="492" fill="#15231d" font-family="Georgia,serif" font-size="22" font-style="italic" text-anchor="end">elevation is the route</text>
  <g filter="url(#grain)" opacity="0.35"><rect width="800" height="560" fill="#fbf7ee"/></g>
</svg>
