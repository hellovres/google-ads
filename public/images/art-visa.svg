<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Passport with a 240-hour transit stamp and clock">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#e7dac1"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2a64c"/><stop offset="1" stop-color="#cf4d2f"/></linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#276354"/><stop offset="1" stop-color="#315b78"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
</defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="642" cy="147" r="103" fill="#fbf7ee" stroke="#15231d" stroke-width="2"/>
  <circle cx="642" cy="147" r="85" fill="none" stroke="#cf4d2f" stroke-width="1" stroke-dasharray="3 5"/>
  <g transform="translate(642 147)" fill="none" stroke="#15231d">
    <circle r="66" stroke-width="2"/>
    <path d="M0-66V0l41 27" stroke="#cf4d2f" stroke-width="5" stroke-linecap="round"/>
    <g stroke-width="1" opacity="0.45">
      <path d="M0-60v8M0 60v-8M-60 0h8M60 0h-8M42-42l-6 6M-42 42l6-6M42 42l-6-6M-42-42l6 6"/>
    </g>
  </g>
  <text x="642" y="278" text-anchor="middle" fill="#15231d" font-family="Georgia,serif" font-size="23">240 hours</text>
  <g transform="translate(117 132) rotate(-7)">
    <rect width="277" height="350" rx="10" fill="#b23a2b"/>
    <rect x="18" y="18" width="241" height="314" rx="4" fill="none" stroke="#f1e4c5" stroke-width="1" opacity="0.55"/>
    <circle cx="138" cy="86" r="40" fill="none" stroke="#f1e4c5" stroke-width="1.5"/>
    <path d="M113 86h50M138 61v50" stroke="#f1e4c5" stroke-width="1"/>
    <text x="138" y="160" text-anchor="middle" fill="#f1e4c5" font-family="Georgia,serif" font-size="19" letter-spacing="2">CHINA</text>
    <text x="138" y="184" text-anchor="middle" fill="#f1e4c5" font-family="DM Sans,sans-serif" font-size="8" letter-spacing="3">TRANSIT</text>
    <g transform="translate(45 228) rotate(-8)">
      <circle cx="80" cy="34" r="46" fill="none" stroke="#f1e4c5" stroke-width="2" opacity="0.8"/>
      <text x="80" y="32" text-anchor="middle" fill="#f1e4c5" font-family="DM Sans,sans-serif" font-size="8" letter-spacing="2">TEMPORARY</text>
      <text x="80" y="47" text-anchor="middle" fill="#f1e4c5" font-family="DM Sans,sans-serif" font-size="8" letter-spacing="2">ENTRY</text>
    </g>
  </g>
  <g transform="translate(474 353)">
    <rect width="238" height="92" rx="7" fill="#276354"/>
    <text x="15" y="26" fill="#d2a64c" font-family="DM Sans,sans-serif" font-size="8" letter-spacing="2">BEFORE YOU FLY</text>
    <text x="15" y="49" fill="#fbf7ee" font-family="Georgia,serif" font-size="16">Check the port list</text>
    <text x="15" y="70" fill="#b9c9c1" font-family="DM Sans,sans-serif" font-size="8">Entry point · onward ticket · hotel</text>
  </g>
  <text x="53" y="517" fill="#15231d" font-family="Georgia,serif" font-size="21" font-style="italic">the clock starts at the border</text>
  <g filter="url(#grain)" opacity="0.35"><rect width="800" height="560" fill="#fbf7ee"/></g>
</svg>
