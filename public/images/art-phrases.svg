<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Mandarin phrase bubbles with pinyin">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#e7dac1"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2a64c"/><stop offset="1" stop-color="#cf4d2f"/></linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#276354"/><stop offset="1" stop-color="#315b78"/></linearGradient>
  <pattern id="windows" width="18" height="22" patternUnits="userSpaceOnUse"><rect width="18" height="22" fill="#15231d"/><rect x="4" y="5" width="5" height="6" fill="#d2a64c" opacity="0.9"/><rect x="12" y="13" width="3" height="4" fill="#fbf7ee" opacity="0.7"/></pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
</defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <circle cx="143" cy="112" r="61" fill="#d2a64c" opacity="0.25"/>
  <path d="M0 430c106-39 191-23 281 15 95 40 186 34 276-5 79-34 154-29 243 8v112H0Z" fill="#276354" opacity="0.16"/>
  <g>
    <rect x="88" y="104" width="344" height="134" rx="30" fill="#fbf7ee" stroke="#15231d" stroke-width="2"/>
    <path d="m139 238 19 42 32-42" fill="#fbf7ee" stroke="#15231d" stroke-width="2"/>
    <text x="119" y="167" fill="#15231d" font-family="Georgia,serif" font-size="46" lang="zh-CN">你好</text>
    <text x="121" y="200" fill="#cf4d2f" font-family="DM Sans,sans-serif" font-size="13" letter-spacing="2">nǐ hǎo</text>
    <text x="362" y="195" text-anchor="end" fill="#67736c" font-family="DM Sans,sans-serif" font-size="10">hello</text>
  </g>
  <g>
    <rect x="407" y="245" width="304" height="113" rx="26" fill="#276354"/>
    <path d="m620 358 17 35 28-35" fill="#276354"/>
    <text x="434" y="299" fill="#fbf7ee" font-family="Georgia,serif" font-size="37" lang="zh-CN">多少钱</text>
    <text x="436" y="328" fill="#d2a64c" font-family="DM Sans,sans-serif" font-size="12" letter-spacing="2">duō shao qián</text>
    <text x="680" y="328" text-anchor="end" fill="#b9c9c1" font-family="DM Sans,sans-serif" font-size="9">how much</text>
  </g>
  <g>
    <rect x="123" y="333" width="255" height="94" rx="23" fill="#cf4d2f"/>
    <path d="m197 427 14 29 24-29" fill="#cf4d2f"/>
    <text x="149" y="379" fill="#fbf7ee" font-family="Georgia,serif" font-size="33" lang="zh-CN">谢谢</text>
    <text x="150" y="405" fill="#f1e4c5" font-family="DM Sans,sans-serif" font-size="11" letter-spacing="2">xiè xie</text>
    <text x="354" y="405" text-anchor="end" fill="#f1e4c5" font-family="DM Sans,sans-serif" font-size="9">thank you</text>
  </g>
  <text x="698" y="493" text-anchor="end" fill="#15231d" font-family="Georgia,serif" font-size="21" font-style="italic">five phrases, one better trip</text>
  <g filter="url(#grain)" opacity="0.35"><rect width="800" height="560" fill="#fbf7ee"/></g>
</svg>
