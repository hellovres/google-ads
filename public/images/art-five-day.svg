  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2a64c"/><stop offset="1" stop-color="#cf4d2f"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
</defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <g fill="none" stroke="#276354" opacity="0.16"><path d="M-10 110c90-32 148-3 205 31s105 31 162-7 102-35 164-1 105 42 179 12" stroke-width="1.2"/><path d="M-10 150c85-23 144 0 200 33s105 27 160-11 106-30 164 2 106 37 186 20" stroke-width="1.2"/><path d="M-10 190c82-16 139 4 196 33s107 23 162-14 104-27 161 5 104 33 181 19" stroke-width="1.2"/></g>
  <path d="M101 409c43-34 61-86 115-91 41-4 54 31 76 3 23-29 11-82 52-102 48-23 86 30 126 9 29-15 23-64 55-80 33-17 64 14 107-5" fill="none" stroke="#cf4d2f" stroke-width="5" stroke-linecap="round"/>
  <g fill="#15231d" stroke="#fbf7ee" stroke-width="4">
    <circle cx="101" cy="409" r="24"/><circle cx="216" cy="318" r="24"/><circle cx="344" cy="218" r="24"/><circle cx="470" cy="227" r="24"/><circle cx="632" cy="143" r="24"/>
  </g>
  <g fill="#fbf7ee" font-family="Georgia,serif" font-size="13">
